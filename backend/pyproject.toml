[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poyo-backend"
version = "0.1.0"
description = "Backend API for the Poyo hands-on learning platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.2.1",
  "sqlalchemy>=2.0.29",
  "alembic>=1.13.1",
  "asyncpg>=0.29.0",
  "httpx>=0.27.0",
  "celery>=5.3.6",
  "redis>=5.0.3",
  "pillow>=10.3.0",
  "pytesseract>=0.3.10",
  "nltk>=3.8.1",
  "spacy>=3.7.4"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.3.5",
  "pytest>=8.1.1",
  "pytest-asyncio>=0.23.6",
  "httpx[http2]>=0.27.0"
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
